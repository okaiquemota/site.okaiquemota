# Publica o painel (pasta painel/) na Cloudflare a cada mudança nele na main.
# Precisa do segredo CLOUDFLARE_API_TOKEN; PAINEL_SENHA é opcional (veja painel/README.md).
name: Publicar o painel

on:
  push:
    branches: [main]
    paths:
      - "painel/**"
      - ".github/workflows/painel.yml"
  workflow_dispatch:

concurrency:
  group: painel
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Conferir o token
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::Falta o segredo CLOUDFLARE_API_TOKEN (veja painel/README.md). Nada foi publicado."
            echo "tem=nao" >> "$GITHUB_OUTPUT"
          else
            echo "tem=sim" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.tem == 'sim'

      - uses: actions/setup-node@v4
        if: steps.token.outputs.tem == 'sim'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: painel/package-lock.json

      - name: Instalar
        if: steps.token.outputs.tem == 'sim'
        working-directory: painel
        run: npm ci

      - name: Publicar
        if: steps.token.outputs.tem == 'sim'
        working-directory: painel
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAINEL_SENHA: ${{ secrets.PAINEL_SENHA }}
        run: npm run publicar
