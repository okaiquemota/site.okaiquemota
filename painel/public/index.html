<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <title>Painel · Kaique Mota</title>
    <meta name="theme-color" content="#f5f4f1">
    <link rel="icon" href="assinatura.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icone-180.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="preload" href="fontes/tinos-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="painel.css">
</head>
<body>
    <a class="pular" href="#app">Pular pro conteúdo</a>
    <aside class="lado" id="topo" hidden>
        <div class="lado-topo">
            <a class="marca" href="#/">Kaique Mota <span class="rotulo">Painel</span></a>
            <button class="recolher" type="button" id="recolher" aria-label="Recolher o menu" aria-expanded="true" aria-controls="topo"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 10l-2 2 2 2"/></svg></button>
        </div>
        <button class="botao novo" type="button" id="novo-trabalho" aria-label="Novo trabalho" title="Novo trabalho"><span aria-hidden="true">+</span><span class="rotulo-menu">Novo trabalho</span></button>
        <nav class="menu" aria-label="Menu">
            <a title="Trabalhos" href="#/" data-menu="inicio"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="11" rx="1"/><rect x="17" y="4" width="4" height="7" rx="1"/></svg><span class="rotulo-menu">Trabalhos</span></a>
            <a title="Agenda" href="#/agenda" data-menu="agenda"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/></svg><span class="rotulo-menu">Agenda</span></a>
            <a title="Clientes" href="#/clientes" data-menu="clientes"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg><span class="rotulo-menu">Clientes</span></a>
            <a title="Financeiro" href="#/financeiro" data-menu="financeiro"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg><span class="rotulo-menu">Financeiro</span></a>
        </nav>
        <div class="lado-base">
            <button type="button" id="seus-dados" title="Seus dados do contrato"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg><span class="rotulo-menu">Seus dados do contrato</span></button>
            <a href="/api/backup" download title="Baixar backup"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg><span class="rotulo-menu">Baixar backup</span></a>
            <button type="button" id="sair" title="Sair"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H6a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4M15 8l4 4-4 4M19 12H9"/></svg><span class="rotulo-menu">Sair</span></button>
        </div>
    </aside>

    <div class="palco">
        <header class="cabecalho" id="barra">
            <div class="busca-geral" role="search">
                <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>
                <input type="search" id="busca-geral" placeholder="Buscar trabalho ou cliente" aria-controls="busca-resultados" aria-label="Buscar trabalho ou cliente" autocomplete="off">
                <kbd aria-hidden="true">/</kbd>
                <div class="busca-resultados" id="busca-resultados" role="listbox" aria-label="Resultados da busca" hidden></div>
            </div>
        </header>
        <main id="app" tabindex="-1">
            <div class="pagina carregando esqueleto" role="status"><span class="visualmente-escondido">Carregando…</span><span class="e-titulo"></span><span class="e-linha"></span><div class="e-grade"><span></span><span></span><span></span><span></span></div></div>
        </main>
    </div>

    <dialog id="janela" aria-labelledby="janela-titulo"></dialog>
    <div class="aviso" id="aviso" role="status" aria-live="polite"></div>

    <script src="painel.js"></script>
</body>
</html>
